name: Generate YTKACE Cyan and TrollFools packages

on:
  workflow_dispatch:
    inputs:
      create_cyan:
        {
          description: "Generate a .cyan file",
          type: boolean,
          required: true,
          default: true,
        }
      create_tf:
        {
          description: "Generate a TrollFools .zip",
          type: boolean,
          required: true,
          default: true,
        }
      enable_youpip:
        { description: "Integrate YouPiP", type: boolean, default: false }
      enable_ytuhd:
        { description: "Integrate YTUHD", type: boolean, default: false }
      enable_yq:
        { description: "Integrate YouQuality", type: boolean, default: false }
      enable_ryd:
        {
          description: "Integrate Return YouTube Dislikes",
          type: boolean,
          default: false,
        }
      enable_ytabc:
        { description: "Integrate YTABConfig", type: boolean, default: false }
      enable_demc:
        {
          description: "Integrate DontEatMyContent",
          type: boolean,
          default: false,
        }
      display_name:
        {
          description: "App display name",
          type: string,
          required: true,
          default: "YouTube",
        }
      bundle_id:
        {
          description: "App bundle identifier",
          type: string,
          required: true,
          default: "com.google.ios.youtube",
        }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-tweaks:
    uses: ./.github/workflows/_build_tweaks.yml
    with:
      enable_youpip: ${{ inputs.enable_youpip }}
      enable_ytuhd: ${{ inputs.enable_ytuhd }}
      enable_yq: ${{ inputs.enable_yq }}
      enable_ryd: ${{ inputs.enable_ryd }}
      enable_ytabc: ${{ inputs.enable_ytabc }}
      enable_demc: ${{ inputs.enable_demc }}

  package:
    name: Generate packages
    runs-on: macos-latest
    needs: build-tweaks
    permissions:
      contents: write
    steps:
      - name: Require an output format
        if: ${{ !inputs.create_cyan && !inputs.create_tf }}
        run: |
          echo "Select at least one output format." >&2
          exit 1

      - name: Download built injectables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: built-debs
          path: injectables

      - name: Install packaging tools
        run: |
          brew install dpkg
          pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/740d3716dcd98c20c000f12cdb88f1f0b2a533a4.zip

      - name: Read YTKACE version
        id: metadata
        run: echo "version=$(dpkg-deb -f injectables/ytkace.deb Version)" >> "$GITHUB_OUTPUT"

      - name: Generate Cyan package
        if: ${{ inputs.create_cyan }}
        env:
          APP_BUNDLE_ID: ${{ inputs.bundle_id }}
          APP_DISPLAY_NAME: ${{ inputs.display_name }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          injectables=()
          while IFS= read -r path; do
            injectables+=("$path")
          done < <(find injectables -mindepth 1 \( -type f -name '*.deb' -o -type d -name '*.appex' \) -print | LC_ALL=C sort)
          mkdir -p release
          cgen -uwef "${injectables[@]}" -n "$APP_DISPLAY_NAME" -b "$APP_BUNDLE_ID" -o "release/YTKACE_${VERSION}.cyan"

      - name: Generate TrollFools package
        if: ${{ inputs.create_tf }}
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          release_dir="$PWD/release"
          mkdir -p "$work/output" "$release_dir"
          while IFS= read -r -d '' package; do
            package_root="$work/package"
            rm -rf "$package_root"
            mkdir -p "$package_root"
            dpkg-deb -x "$package" "$package_root"
            find "$package_root" -type f -name '*.dylib' -exec cp {} "$work/output/" \;
            find "$package_root" -type f -name '*.plist' -exec cp {} "$work/output/" \;
            find "$package_root" -type d -name '*.bundle' -exec cp -R {} "$work/output/" \;
          done < <(find injectables -type f -name '*.deb' -print0)
          (cd "$work/output" && zip -qr "$release_dir/TrollFools_YTKACE_${VERSION}.zip" .)

      - name: Create draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ytkace-packages-${{ github.run_number }}
          name: YTKACE ${{ steps.metadata.outputs.version }} packages
          files: release/*
          draft: true
