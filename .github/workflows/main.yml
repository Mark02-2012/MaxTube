name: Create MaxTube app

on:
  workflow_dispatch:
    inputs:
      enable_youpip:
        {
          description: "Integrate YouPiP",
          type: boolean,
          required: true,
          default: false,
        }
      enable_ytuhd:
        {
          description: "Integrate YTUHD",
          type: boolean,
          required: true,
          default: false,
        }
      enable_yq:
        {
          description: "Integrate YouQuality",
          type: boolean,
          required: true,
          default: false,
        }
      enable_ryd:
        {
          description: "Integrate Return YouTube Dislikes",
          type: boolean,
          required: true,
          default: false,
        }
      enable_ytabc:
        {
          description: "Integrate YTABConfig",
          type: boolean,
          required: true,
          default: false,
        }
      enable_demc:
        {
          description: "Integrate DontEatMyContent",
          type: boolean,
          required: true,
          default: false,
        }
      enable_ytweaks:
        {
          description: "Integrate YTweaks",
          type: boolean,
          required: true,
          default: false,
        }
      enable_gonerino:
        {
          description: "Integrate Gonerino",
          type: boolean,
          required: true,
          default: false,
        }
      enable_youspeed:
        {
          description: "Integrate YouSpeed",
          type: boolean,
          required: true,
          default: false,
        }
      enable_ytlcm:
        {
          description: "Integrate YTLowContrastMode",
          type: boolean,
          required: true,
          default: false,
        }
      enable_VolumeBoostYT:
        {
          description: "Integrate VolumeBoostYT",
          type: boolean,
          required: true,
          default: false,
        }
      enable_YouGetCaption:
        {
          description: "Integrate YouGetCaption",
          type: boolean,
          required: true,
          default: false,
        }
      enable_ytpf:
        {
          description: "Integrate YTPlaybackFix",
          type: boolean,
          required: true,
          default: false,
        }
      enable_ytpfBETA:
        {
          description: "Integrate the latest YTPlaybackFix beta",
          type: boolean,
          required: true,
          default: false,
        }
      enable_ycq:
        {
          description: "Integrate YouChooseQuality",
          type: boolean,
          required: true,
          default: false,
        }
      enable_ys:
        {
          description: "Integrate YouShare",
          type: boolean,
          required: true,
          default: false,
        }
      enable_youloop:
        {
          description: "Integrate YouLoop",
          type: boolean,
          required: true,
          default: false,
        }
      enable_youmute:
        {
          description: "Integrate YouMute",
          type: boolean,
          required: true,
          default: false,
        }
      ipa_url:
        description: "Direct URL to a decrypted universal iPhone/iPad YouTube IPA"
        required: true
        type: string
      display_name:
        description: "App display name"
        default: "YouTube"
        required: true
        type: string
      bundle_id:
        description: "App bundle identifier"
        default: "com.google.ios.youtube"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-tweaks:
    uses: ./.github/workflows/_build_tweaks.yml
    with:
      enable_youpip: ${{ inputs.enable_youpip }}
      enable_ytuhd: ${{ inputs.enable_ytuhd }}
      enable_yq: ${{ inputs.enable_yq }}
      enable_ryd: ${{ inputs.enable_ryd }}
      enable_ytabc: ${{ inputs.enable_ytabc }}
      enable_demc: ${{ inputs.enable_demc }}
      enable_ytweaks: ${{ inputs.enable_ytweaks }}
      enable_gonerino: ${{ inputs.enable_gonerino }}
      enable_youspeed: ${{ inputs.enable_youspeed }}
      enable_ytlcm: ${{ inputs.enable_ytlcm }}
      enable_VolumeBoostYT: ${{ inputs.enable_VolumeBoostYT }}
      enable_YouGetCaption: ${{ inputs.enable_YouGetCaption }}
      enable_ytpf: ${{ inputs.enable_ytpf }}
      enable_ytpfBETA: ${{ inputs.enable_ytpfBETA }}
      enable_ycq: ${{ inputs.enable_ycq }}
      enable_ys: ${{ inputs.enable_ys }}
      enable_youloop: ${{ inputs.enable_youloop }}
      enable_youmute: ${{ inputs.enable_youmute }}

  package:
    name: Package IPA
    runs-on: macos-latest
    needs: build-tweaks
    outputs:
      release_name: ${{ steps.metadata.outputs.release_name }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download built injectables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: built-debs
          path: injectables

      - name: Hide IPA URL
        uses: levibostian/action-hide-sensitive-inputs@15951963797b16aa43fa0b093b45cd2db0319fdd # v1
        with:
          exclude_inputs: bundle_id,display_name,enable_demc,enable_ryd,enable_ytabc,enable_youpip,enable_yq,enable_ytuhd,enable_ytweaks,enable_gonerino,enable_youspeed,enable_ytlcm,enable_VolumeBoostYT,enable_YouGetCaption,enable_ycq,enable_ys,enable_youloop,enable_youmute,enable_ytpf,enable_ytpfBETA

      - name: Download IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          curl --fail --location "$IPA_URL" --output youtube.ipa
          unzip -tq youtube.ipa >/dev/null

      - name: Install packaging tools
        run: |
          brew install dpkg
          pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/740d3716dcd98c20c000f12cdb88f1f0b2a533a4.zip

      - name: Read artifact metadata
        id: metadata
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import plistlib
          import re
          import subprocess
          import zipfile

          with zipfile.ZipFile("youtube.ipa") as archive:
              names = [name for name in archive.namelist()
                       if name.startswith("Payload/") and name.endswith(".app/Info.plist")]
              if len(names) != 1:
                  raise SystemExit(f"expected one app Info.plist, found {len(names)}")
              version = plistlib.loads(archive.read(names[0])).get("CFBundleShortVersionString", "")

          enhancer = subprocess.check_output(
              ["dpkg-deb", "-f", "injectables/ytkace.deb", "Version"], text=True
          ).strip()
          for label, value in (("YouTube", version), ("YTKACE", enhancer)):
              if not re.fullmatch(r"[A-Za-z0-9._-]+", value):
                  raise SystemExit(f"unsafe {label} version: {value!r}")

          print(f"youtube_version={version}")
          print(f"enhancer_version={enhancer}")
          print(f"ipa=MaxTube_YouTube_{version}_YTKACE_{enhancer}.ipa")
          print(f"release_tag=ytkace-{enhancer}-youtube-{version}-${{ github.run_number }}")
          print(f"release_name=MaxTube: YTKACE {enhancer} with YouTube {version}")
          PY

      - name: Package IPA
        env:
          APP_BUNDLE_ID: ${{ inputs.bundle_id }}
          APP_DISPLAY_NAME: ${{ inputs.display_name }}
          OUTPUT_IPA: ${{ steps.metadata.outputs.ipa }}
        run: |
          extras=()
          while IFS= read -r path; do
            extras+=("$path")
          done < <(find injectables -mindepth 1 \
            \( -type f -name '*.deb' ! -name 'ytkace.deb' -o -type d -name '*.appex' \) \
            -print | LC_ALL=C sort)
          scripts/package-ios.sh \
            youtube.ipa \
            injectables/ytkace.deb \
            "release/$OUTPUT_IPA" \
            "${extras[@]}"

      - name: Prepare release notes
        env:
          ENHANCER_VERSION: ${{ steps.metadata.outputs.enhancer_version }}
          YOUTUBE_VERSION: ${{ steps.metadata.outputs.youtube_version }}
        run: |
          sed \
            -e "s/%yt_version%/$YOUTUBE_VERSION/g" \
            -e "s/%ytkace_version%/$ENHANCER_VERSION/g" \
            .github/RELEASE_TEMPLATE/Release_Notes.md > release/release-notes.md
          cp THIRD_PARTY_NOTICES.md release/

      - name: Upload packaged release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-release
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Create draft release
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write
    steps:
      - name: Download packaged release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packaged-release
          path: release

      - name: Create draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.package.outputs.release_tag }}
          name: ${{ needs.package.outputs.release_name }}
          files: |
            release/*.ipa
            release/THIRD_PARTY_NOTICES.md
          body_path: release/release-notes.md
          draft: true
