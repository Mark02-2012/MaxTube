name: Publish multi-platform MaxTube release

on:
  workflow_dispatch:
    inputs:
      ios_ipa_url:
        description: "Direct URL to a decrypted universal iPhone/iPad YouTube IPA (optional)"
        required: false
        type: string
      tvos_ipa_url:
        description: "Direct URL to a decrypted YouTube tvOS 4.54.01 IPA (optional)"
        required: false
        type: string
      release_title:
        description: "Release title; generated from packaged versions when empty"
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-inputs:
    name: Validate release request
    runs-on: ubuntu-latest
    steps:
      - name: Require at least one platform
        env:
          IOS_IPA_URL: ${{ inputs.ios_ipa_url }}
          TVOS_IPA_URL: ${{ inputs.tvos_ipa_url }}
        run: |
          if [[ -z "$IOS_IPA_URL" && -z "$TVOS_IPA_URL" ]]; then
            echo "Provide an iOS/iPadOS IPA URL, a tvOS IPA URL, or both." >&2
            exit 1
          fi

  build-ios-enhancer:
    if: ${{ inputs.ios_ipa_url != '' }}
    uses: ./.github/workflows/_build_tweaks.yml

  package-ios:
    name: Package iOS and iPadOS
    if: ${{ always() && inputs.ios_ipa_url != '' && needs.validate-inputs.result == 'success' && needs.build-ios-enhancer.result == 'success' }}
    runs-on: macos-latest
    needs: [validate-inputs, build-ios-enhancer]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download YTKACE package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: built-debs
          path: injectables

      - name: Hide IPA URLs
        uses: levibostian/action-hide-sensitive-inputs@15951963797b16aa43fa0b093b45cd2db0319fdd # v1
        with:
          exclude_inputs: prerelease,release_title

      - name: Download iPhone and iPad base
        env:
          IPA_URL: ${{ inputs.ios_ipa_url }}
        run: |
          curl --fail --location "$IPA_URL" --output youtube-ios.ipa
          unzip -tq youtube-ios.ipa >/dev/null

      - name: Install iOS packaging tools
        run: |
          brew install dpkg
          pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/740d3716dcd98c20c000f12cdb88f1f0b2a533a4.zip

      - name: Read package metadata
        id: metadata
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import plistlib
          import re
          import subprocess
          import zipfile

          with zipfile.ZipFile("youtube-ios.ipa") as archive:
              names = [name for name in archive.namelist()
                       if name.startswith("Payload/") and name.endswith(".app/Info.plist")]
              if len(names) != 1:
                  raise SystemExit(f"expected one app Info.plist, found {len(names)}")
              version = plistlib.loads(archive.read(names[0])).get("CFBundleShortVersionString", "")

          enhancer = subprocess.check_output(
              ["dpkg-deb", "-f", "injectables/ytkace.deb", "Version"], text=True
          ).strip()
          for label, value in (("YouTube", version), ("YTKACE", enhancer)):
              if not re.fullmatch(r"[A-Za-z0-9._-]+", value):
                  raise SystemExit(f"unsafe {label} version: {value!r}")

          print(f"ipa=MaxTube_iOS-iPadOS_YouTube_{version}_YTKACE_{enhancer}.ipa")
          PY

      - name: Package iPhone and iPad IPA
        env:
          OUTPUT_IPA: ${{ steps.metadata.outputs.ipa }}
        run: |
          extras=()
          while IFS= read -r path; do
            extras+=("$path")
          done < <(find injectables -mindepth 1 \
            \( -type f -name '*.deb' ! -name 'ytkace.deb' -o -type d -name '*.appex' \) \
            -print | LC_ALL=C sort)
          scripts/package-ios.sh \
            youtube-ios.ipa \
            injectables/ytkace.deb \
            "release/$OUTPUT_IPA" \
            "${extras[@]}"

      - name: Upload iPhone and iPad release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-ios-ipados
          path: release/*.ipa
          if-no-files-found: error
          retention-days: 7

  package-tvos:
    name: Package tvOS
    if: ${{ inputs.tvos_ipa_url != '' }}
    runs-on: macos-latest
    needs: validate-inputs
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Hide IPA URLs
        uses: levibostian/action-hide-sensitive-inputs@15951963797b16aa43fa0b093b45cd2db0319fdd # v1
        with:
          exclude_inputs: prerelease,release_title

      - name: Download Apple TV base
        env:
          IPA_URL: ${{ inputs.tvos_ipa_url }}
        run: |
          curl --fail --location "$IPA_URL" --output youtube-tvos.ipa
          unzip -tq youtube-tvos.ipa >/dev/null

      - name: Install MuTube runner
        run: brew install uv

      - name: Package Apple TV IPA
        run: |
          source config/mutube.env
          short_revision="${MUTUBE_REVISION:0:7}"
          scripts/package-tvos.sh \
            youtube-tvos.ipa \
            "release/MaxTube_tvOS_YouTube_${MUTUBE_YOUTUBE_VERSION}_MuTube_${short_revision}.ipa"

      - name: Upload Apple TV release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-tvos
          path: release/*.ipa
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Create tagged GitHub release
    if: >-
      ${{
        always() &&
        needs.validate-inputs.result == 'success' &&
        (inputs.ios_ipa_url == '' || needs.package-ios.result == 'success') &&
        (inputs.tvos_ipa_url == '' || needs.package-tvos.result == 'success')
      }}
    runs-on: ubuntu-latest
    needs: [validate-inputs, package-ios, package-tvos]
    permissions:
      contents: write
    steps:
      - name: Checkout release notices
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download packaged IPAs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Generate release identity and notes
        id: metadata
        env:
          RELEASE_TITLE: ${{ inputs.release_title }}
          RUN_NUMBER: ${{ github.run_number }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import plistlib
          import re
          import zipfile
          from pathlib import Path

          release = Path("release")
          ipas = sorted(release.glob("*.ipa"))
          if not ipas:
              raise SystemExit("no packaged IPAs were downloaded")

          labels = []
          lines = ["## MaxTube multi-platform release", ""]
          for ipa in ipas:
              with zipfile.ZipFile(ipa) as archive:
                  names = [name for name in archive.namelist()
                           if name.startswith("Payload/") and name.endswith(".app/Info.plist")]
                  if len(names) != 1:
                      raise SystemExit(f"{ipa.name}: expected one app Info.plist")
                  info = plistlib.loads(archive.read(names[0]))
              version = info.get("CFBundleShortVersionString", "")
              platforms = info.get("CFBundleSupportedPlatforms", [])
              if not re.fullmatch(r"[A-Za-z0-9._-]+", version):
                  raise SystemExit(f"{ipa.name}: unsafe version {version!r}")
              platform = "tvOS" if "AppleTVOS" in platforms else "iOS/iPadOS"
              labels.append(f"{platform} YouTube {version}")
              lines.append(f"- `{ipa.name}` — {platform}, YouTube {version}")

          lines += [
              "",
              "These IPAs are unsigned. Sign each IPA for the destination device using your own Apple account.",
              "The iPhone/iPad artifact requires iOS or iPadOS 15.0 or newer; the Apple TV artifact preserves its base IPA minimum.",
              "",
              f"Source revision: `{os.environ['SOURCE_SHA']}`",
          ]
          (release / "release-notes.md").write_text("\n".join(lines) + "\n", encoding="utf-8")

          title_input = os.environ["RELEASE_TITLE"]
          if "\n" in title_input or "\r" in title_input:
              raise SystemExit("release title must be a single line")
          title = title_input.strip() or "MaxTube: " + ", ".join(labels)
          tag = f"maxtube-{os.environ['RUN_NUMBER']}-{os.environ['SOURCE_SHA'][:7]}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"title={title}", file=output)
              print(f"tag={tag}", file=output)
          PY
          cp THIRD_PARTY_NOTICES.md release/

      - name: Publish release and tag
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.metadata.outputs.title }}
          files: |
            release/*.ipa
            release/THIRD_PARTY_NOTICES.md
          body_path: release/release-notes.md
          draft: false
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ !inputs.prerelease }}
